<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>
  
  <!-- Shield outline -->
  <path d="M256 80 L380 140 L380 260 Q380 360 256 432 Q132 360 132 260 L132 140 Z" 
        fill="none" stroke="white" stroke-width="12" opacity="0.3"/>
  
  <!-- Shield main -->
  <path d="M256 96 L368 148 L368 260 Q368 350 256 416 Q144 350 144 260 L144 148 Z" 
        fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="8"/>
  
  <!-- Lock body -->
  <rect x="216" y="240" width="80" height="100" rx="8" 
        fill="white" opacity="0.95"/>
  
  <!-- Lock shackle -->
  <path d="M236 240 L236 210 Q236 180 256 180 Q276 180 276 210 L276 240" 
        fill="none" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Keyhole -->
  <circle cx="256" cy="275" r="12" fill="url(#grad1)"/>
  <rect x="250" y="275" width="12" height="30" rx="2" fill="url(#grad1)"/>
  
  <!-- Circuit lines decoration -->
  <g opacity="0.3" stroke="white" stroke-width="2" fill="none">
    <circle cx="200" cy="200" r="8"/>
    <line x1="208" y1="200" x2="230" y2="200"/>
    <circle cx="312" cy="200" r="8"/>
    <line x1="282" y1="200" x2="304" y2="200"/>
    <circle cx="200" cy="320" r="8"/>
    <line x1="208" y1="320" x2="216" y2="320"/>
    <circle cx="312" cy="320" r="8"/>
    <line x1="296" y1="320" x2="304" y2="320"/>
  </g>
  
  <!-- Glow effect on shield -->
  <path d="M256 96 L368 148 L368 260 Q368 350 256 416 Q144 350 144 260 L144 148 Z" 
        fill="none" stroke="white" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
</svg>
